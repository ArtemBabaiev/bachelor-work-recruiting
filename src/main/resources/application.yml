spring: 
  application:
    name: developmentClient
  config:
    import: optional:configserver:http://localhost:8888
  datasource: 
    url: jdbc:mysql://localhost:3306/bachelor-recruiting?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    #show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: 
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        #globally_quoted_identifiers: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: artdcxx4@gmail.com
    password: ${GOOGLE_APPLICATION_PASSWORD}
    from: Recruiting-Bachelor-Project
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
management:
