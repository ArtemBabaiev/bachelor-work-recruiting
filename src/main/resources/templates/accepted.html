<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
	<p>Congratulations</p>
	<p>
		Your application for '<span th:text="${model.positionName}"></span>'
		at <span th:text="${model.companyName}"></span> was accepted
	</p>
	<th:block>
		<p>Recruiter comment:</p>
		<p>
			<span th:text="${model.notes}"></span>
		</p>
	</th:block>
</body>
</html>
